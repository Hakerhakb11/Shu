name: Integration CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'tests/integration/**'

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml syntax
        run: docker compose config -q
