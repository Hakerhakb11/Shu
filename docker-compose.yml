name: shu

services:
  # api-gateway────────────────────────────────────────────────────────────────────────────
  api-gateway:
    build: services/api-gateway
    container_name: shu-api-gateway
    ports: ${API_GATEWAY_PORT:-8080}:8080

  # auth────────────────────────────────────────────────────────────────────────────
  auth:
    build: services/auth-service
    container_name: shu-auth-service
    ports: ${AUTH_SERVICE_PORT:-8081}:8080
  auth-postgres:
    image: postgres:18
    container_name: shu-auth-postgres
    restart: unless-stopped
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # catalog────────────────────────────────────────────────────────────────────────────
  catalog:
    build: services/catalog-service
    container_name: shu-catalog-service
    ports: ${CATALOG_SERVICE_PORT:-8082}:5000
  catalog-postgres:
    image: postgres:18
    container_name: shu-catalog-postgres
    restart: unless-stopped
    ports:
      - "${CATALOG_DB_PORT:-5433}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog_db}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog_user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_password}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # cart────────────────────────────────────────────────────────────────────────────
  cart:
    build: services/cart-service
    container_name: shu-cart-service
    ports: ${CART_SERVICE_PORT:-8083}:5000
  cart-postgres:
    image: postgres:18
    container_name: shu-cart-postgres
    restart: unless-stopped
    ports:
      - "${CART_DB_PORT:-5434}:5432"
    volumes:
      - cart_pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${CART_DB_NAME:-cart_db}
      POSTGRES_USER: ${CART_DB_USER:-cart_user}
      POSTGRES_PASSWORD: ${CART_DB_PASSWORD:-cart_password}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: shu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  auth_pgdata:
  catalog_pgdata:
  cart_pgdata:
  redis_data:
